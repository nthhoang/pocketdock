name: build-desktop
on:
  push:
    paths:
      - 'desktop/**'
      - 'server/**'
      - 'web/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build chương trình phụ lấy âm thanh (C#)
        run: |
          dotnet publish audio-helper/AudioHelper.csproj -c Release -o audio-helper/publish
          ls -la audio-helper/publish
          ./audio-helper/publish/PocketDock.AudioHelper.exe --version

      - name: Build máy chủ để đóng gói cùng
        run: |
          cd ../server
          ./gradlew installDist
          ls build/install/pocketdock-server/lib
          test -f build/install/pocketdock-server/bin/pocketdock-server.bat

      - name: Build và chạy test
        run: ./gradlew build

      - name: Gom ứng dụng và thư viện vào một thư mục
        run: |
          ./gradlew installDist
          echo "--- Nội dung app/build/install/app/lib ---"
          ls -la app/build/install/app/lib
          test -f app/build/install/app/lib/app.jar

      - name: Tìm các module Java cần cho bản đóng gói
        id: mods
        run: |
          SRV=../server/build/install/pocketdock-server/lib
          MODS=$(jdeps --ignore-missing-deps --multi-release 21 --print-module-deps \
            --class-path "app/build/install/app/lib/*;$SRV/*" app/build/install/app/lib/app.jar $SRV/pocketdock-server-*.jar) || MODS=java.base
          EXTRA=java.sql,java.net.http,java.desktop,java.logging,java.management,java.naming,java.xml,java.prefs,jdk.unsupported,jdk.crypto.ec
          echo "jdeps: $MODS"
          echo "list=$MODS,$EXTRA" >> "$GITHUB_OUTPUT"

      - name: Đóng gói bản chạy Windows
        run: >
          jpackage --type app-image --name PocketDock
          --input app/build/install/app/lib --main-jar app.jar
          --main-class com.pocketdock.App
          --add-modules "${{ steps.mods.outputs.list }}"
          --win-console --dest dist

      - name: Chép chương trình phụ âm thanh vào bản đóng gói
        run: |
          mkdir -p dist/PocketDock/audio-helper
          cp -r audio-helper/publish/* dist/PocketDock/audio-helper/

      - name: Chép máy chủ, trang web và file chạy nhanh vào bản đóng gói
        run: |
          mkdir -p dist/PocketDock/server dist/PocketDock/web
          cp -r ../server/build/install/pocketdock-server/* dist/PocketDock/server/
          cp -r ../web/* dist/PocketDock/web/
          cp pack/Chay-PocketDock.bat pack/HUONG-DAN.txt dist/PocketDock/

      - name: Kiểm tra bản đóng gói có đủ thư viện
        run: |
          echo "--- dist/PocketDock ---"
          ls dist/PocketDock
          echo "--- dist/PocketDock/app ---"
          ls dist/PocketDock/app
          test -f dist/PocketDock/PocketDock.exe
          ls dist/PocketDock/app | grep -i "javafx-graphics.*win"
          ls dist/PocketDock/app | grep -i "webrtc-java.*windows"
          ls dist/PocketDock/app | grep -i "sqlite-jdbc"
          ls dist/PocketDock/app | grep -i "gson"
          ls dist/PocketDock/app | grep -i "core-3"
          test -f dist/PocketDock/audio-helper/PocketDock.AudioHelper.exe
          ls dist/PocketDock/audio-helper | grep -i "NAudio"
          dist/PocketDock/audio-helper/PocketDock.AudioHelper.exe --version
          test -f dist/PocketDock/server/bin/pocketdock-server.bat
          test -f dist/PocketDock/web/index.html
          test -f dist/PocketDock/Chay-PocketDock.bat
          echo "--- module trong runtime ---"
          ls dist/PocketDock/runtime/bin; dist/PocketDock/runtime/bin/java.exe --list-modules || true

      - name: Chạy thử máy chủ đóng gói bằng runtime đi kèm
        run: |
          export JAVA_HOME="$(pwd -W)/dist/PocketDock/runtime"
          export WEB_DIR="$(pwd -W)/dist/PocketDock/web"
          export PORT=18081
          cmd //c "dist\\PocketDock\\server\\bin\\pocketdock-server.bat" > server-smoke.log 2>&1 &
          ok=0
          for i in $(seq 1 40); do
            if curl -sf http://localhost:18081/health > /dev/null; then ok=1; break; fi
            sleep 1
          done
          echo "--- server-smoke.log ---"
          tail -30 server-smoke.log || true
          if [ "$ok" = 1 ]; then echo "may chu tra loi /health"; curl -s http://localhost:18081/ | head -c 300; echo; fi
          powershell -NoProfile -Command "Get-CimInstance Win32_Process | Where-Object { \$_.CommandLine -like '*Application[K]t*' } | ForEach-Object { Stop-Process -Id \$_.ProcessId -Force }" || true
          test "$ok" = 1

      - name: Chạy thử bản đóng gói (--selftest)
        run: |
          timeout 120 dist/PocketDock/PocketDock.exe --selftest || echo "selftest thoat voi ma $?"
          test -f ketqua/selftest.txt
          echo "--- ketqua/selftest.txt ---"
          cat ketqua/selftest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PocketDock-windows
          path: |
            desktop/dist
            desktop/ketqua
