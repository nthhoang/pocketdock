name: build-desktop
on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build jar
        run: ./gradlew build
      - name: Package app image
        run: >
          jpackage --type app-image --name PocketDock
          --input app/build/libs --main-jar app.jar
          --main-class com.pocketdock.App
          --win-console --dest dist
      - uses: actions/upload-artifact@v4
        with:
          name: PocketDock-windows
          path: desktop/dist
