name: build-desktop
on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build chương trình phụ lấy âm thanh (C#)
        run: |
          dotnet publish audio-helper/AudioHelper.csproj -c Release -o audio-helper/publish
          ls -la audio-helper/publish
          ./audio-helper/publish/PocketDock.AudioHelper.exe --version

      - name: Build và chạy test
        run: ./gradlew build

      - name: Gom ứng dụng và thư viện vào một thư mục
        run: |
          ./gradlew installDist
          echo "--- Nội dung app/build/install/app/lib ---"
          ls -la app/build/install/app/lib
          test -f app/build/install/app/lib/app.jar

      - name: Tìm các module Java cần cho bản đóng gói
        id: mods
        run: |
          MODS=$(jdeps --ignore-missing-deps --multi-release 21 --print-module-deps \
            --class-path 'app/build/install/app/lib/*' app/build/install/app/lib/app.jar) || MODS=java.base
          EXTRA=java.sql,java.net.http,java.desktop,java.logging,java.management,java.naming,java.xml,java.prefs,jdk.unsupported,jdk.crypto.ec
          echo "jdeps: $MODS"
          echo "list=$MODS,$EXTRA" >> "$GITHUB_OUTPUT"

      - name: Đóng gói bản chạy Windows
        run: >
          jpackage --type app-image --name PocketDock
          --input app/build/install/app/lib --main-jar app.jar
          --main-class com.pocketdock.App
          --add-modules "${{ steps.mods.outputs.list }}"
          --win-console --dest dist

      - name: Chép chương trình phụ âm thanh vào bản đóng gói
        run: |
          mkdir -p dist/PocketDock/audio-helper
          cp -r audio-helper/publish/* dist/PocketDock/audio-helper/

      - name: Kiểm tra bản đóng gói có đủ thư viện
        run: |
          echo "--- dist/PocketDock ---"
          ls dist/PocketDock
          echo "--- dist/PocketDock/app ---"
          ls dist/PocketDock/app
          test -f dist/PocketDock/PocketDock.exe
          ls dist/PocketDock/app | grep -i "javafx-graphics.*win"
          ls dist/PocketDock/app | grep -i "webrtc-java.*windows"
          ls dist/PocketDock/app | grep -i "sqlite-jdbc"
          ls dist/PocketDock/app | grep -i "gson"
          ls dist/PocketDock/app | grep -i "core-3"
          test -f dist/PocketDock/audio-helper/PocketDock.AudioHelper.exe
          ls dist/PocketDock/audio-helper | grep -i "NAudio"
          dist/PocketDock/audio-helper/PocketDock.AudioHelper.exe --version
          echo "--- module trong runtime ---"
          ls dist/PocketDock/runtime/bin; dist/PocketDock/runtime/bin/java.exe --list-modules || true

      - uses: actions/upload-artifact@v4
        with:
          name: PocketDock-windows
          path: desktop/dist
